name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_USER: rouge_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: rouge_one_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rouge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ['1026:1025', '8026:8025']
    env:
      TEST_SMTP_PORT: 1026
      TEST_MAILPIT_PORT: 8026
      DATABASE_URL: postgresql://rouge_test:test_only@localhost:5432/rouge_one_test
      TEST_DATABASE_URL: postgresql://rouge_test:test_only@localhost:5432/rouge_one_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rouge-one/api db:generate
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
      - run: pnpm release:check
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
